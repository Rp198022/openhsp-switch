name: Build switch NRO

#	T2.2 - cross-compile the OpenHSP runtime for the Nintendo Switch (console backend).
#	T2.3 - same, plus the SDL2/GLES graphical backend (hsp3dish).
#
#	The container image is the official devkitPro one (devkitPro/docker :: devkita64).
#	Note: the repository also carries upstream's own .github/workflows/build.yml
#	(Linux / emscripten / win32); that one is left untouched and is unrelated to
#	the Switch port.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    env:
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/switch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro packages
        #	dkp-pacman is the package manager inside the devkitPro containers.
        #	Deliberately no -y / -Syu: the image already ships the package lists
        #	and forcing a database refresh makes pkg.devkitpro.org answer 403.
        #	switch-mesa provides the EGL/GLES bits the SDL2 port is built against;
        #	the four switch-sdl2* packages are the graphical backend (T2.3).
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-dev devkitA64 libnx switch-tools \
            switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf \
            switch-mesa switch-libdrm_nouveau switch-pkg-config

      - name: Show toolchain versions
        #	The base image only exports DEVKITARM, so DEVKITA64 and the toolchain
        #	directories have to be set explicitly (done above via `env`).
        run: |
          which aarch64-none-elf-g++
          aarch64-none-elf-g++ --version | head -n 1
          which nacptool
          which elf2nro
          dkp-pacman -Q switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf switch-mesa

      - name: Show graphics environment
        #	T2.3 links against both SDL2's portlibs and switch-mesa.  If the link
        #	ever breaks, this listing is what tells us which archives/headers the
        #	container actually ships, without a further round trip.
        run: |
          echo "--- pkg-config ---"
          aarch64-none-elf-pkg-config --libs sdl2 SDL2_image SDL2_mixer SDL2_ttf || true
          echo "--- portlibs/switch/lib (gl/egl/sdl) ---"
          ls -1 $DEVKITPRO/portlibs/switch/lib | grep -iE 'gl|egl|sdl|drm' || true
          echo "--- portlibs/switch/include ---"
          ls -1 $DEVKITPRO/portlibs/switch/include | grep -iE 'gl|egl|sdl|KHR' || true

      - name: Build hsp3switch.nro (T2.2 console backend)
        run: |
          make -f makefile.switch -j$(nproc)

      - name: Upload hsp3switch.nro
        #	The .elf and .map are uploaded as well on purpose: a real-hardware
        #	crash only reports "load base + PC", so resolving it needs the symbol
        #	table (addr2line) and the link map.  See risk R8.
        uses: actions/upload-artifact@v4
        with:
          name: hsp3switch-nro
          path: |
            hsp3switch.nro
            hsp3switch.elf
            hsp3switch.map
          if-no-files-found: error

      - name: Build hsp3dish.nro (T2.3 SDL2/GLES backend)
        run: |
          make -f makefile.switch dish -j$(nproc)

      - name: Upload hsp3dish.nro
        #	Same three-file policy as above - and here it matters more, since the
        #	graphical build has no on-screen console to explain itself.
        uses: actions/upload-artifact@v4
        with:
          name: hsp3dish-nro
          path: |
            hsp3dish.nro
            hsp3dish.elf
            hsp3dish.map
          if-no-files-found: error

      - name: Upload hsp3dish.nro on its own
        #	The archive above carries the .elf and .map for hardware crash triage,
        #	which is most of its size.  The emulator loop only ever needs the .nro,
        #	so publish it separately as well - a much smaller fetch.
        uses: actions/upload-artifact@v4
        with:
          name: hsp3dish-nro-only
          path: hsp3dish.nro
          if-no-files-found: error
